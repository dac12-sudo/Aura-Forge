<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Aura Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0810;--fg:#f3e9df;--card:#15101a;--line:#33222a;--mut:#a08f88;--ac:#ff7a1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.hero{position:relative;overflow:hidden;border-radius:14px;padding:22px 96px 20px 22px;margin:0 0 12px;background:radial-gradient(120% 140% at 50% 130%,#7a2208 0,#2a0f0a 40%,#0b0a10 75%);border:1px solid #3a2016;box-shadow:inset 0 -2px 0 #ff7a1a55}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(circle,#ffb04a 0 1.5px,transparent 2px),radial-gradient(circle,#ff6a1a 0 1px,transparent 1.5px);background-size:110px 150px,170px 210px;background-position:20px 0,70px 40px;animation:emb 7s linear infinite}
@keyframes emb{to{background-position:20px -150px,70px -170px}}
.hero h1{position:relative;margin:0;font:900 clamp(34px,8vw,52px)/1 Cinzel,Georgia,serif;letter-spacing:.06em;background:linear-gradient(180deg,#fff6d0 0%,#ffd060 35%,#ff7a1a 70%,#b3260a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #ff6a1a88) drop-shadow(0 2px 0 #3a0d04);animation:heat 3.5s ease-in-out infinite alternate}
@keyframes heat{to{filter:drop-shadow(0 0 22px #ffa040cc) drop-shadow(0 2px 0 #3a0d04)}}
.hero p{position:relative;margin:8px 0 0;color:#e8b48a;font-size:14px;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.hero::before,.hero h1{animation:none}}
#admbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:10;padding:6px 12px;font-size:13px}
#rstbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 46px);right:8px;z-index:10;padding:6px 12px;font-size:13px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:340px}.modal p{margin:0 0 14px}
#rgo{background:#c62828;border-color:#c62828;color:#fff}
h2{font-size:16px;margin:22px 0 8px}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#070912}
canvas{display:block;width:100%;height:auto}
#ban{position:absolute;left:0;right:0;top:12px;text-align:center;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .8s;pointer-events:none;padding:0 8px}
.hud{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0;color:var(--mut)}.hud b{color:var(--fg)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:700;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}

#roll{background:var(--ac);color:#fff;border-color:var(--ac);font-size:18px;padding:12px 34px}
#cur{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}

.c{padding:6px 8px;border-radius:8px;background:var(--card);border:2px solid var(--line);cursor:pointer;font-size:12px;min-height:56px;text-align:left;font-weight:400;color:var(--fg)}
.c.lock{opacity:.4;cursor:default}.c.on{box-shadow:0 0 0 2px var(--ac)}
.c b{display:block;font-size:13px}.c small{color:var(--mut)}
@media (prefers-reduced-motion:reduce){#ban{transition:none}}
.adm{margin:12px 0;padding:12px;border:1px solid var(--ac);border-radius:10px;background:var(--card);display:grid;gap:8px}
.adm .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}
html{scrollbar-color:#5a3020 #0a0810}
body{background:radial-gradient(90% 55% at 50% 115%,#2e0f06 0,transparent 70%),radial-gradient(70% 40% at 50% -10%,#1e1232 0,transparent 70%),var(--bg);background-attachment:fixed}
main{max-width:820px}
.stage{border:1px solid #5a301c;border-radius:16px;box-shadow:0 0 0 1px #000,0 12px 44px -12px #ff6a1a66}

#grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.c{position:relative;overflow:hidden;border:1px solid var(--r,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--r,#333) 14%,#17111c),#120d17);border-radius:10px;box-shadow:0 0 14px -6px var(--r,transparent);padding:10px 10px 8px;min-height:62px;transition:transform .12s,box-shadow .12s}

.c:hover:not(.lock){transform:translateY(-2px);box-shadow:0 0 18px -2px var(--r)}
.c.lock{background:repeating-linear-gradient(135deg,#120d17 0 8px,#160f1b 8px 16px);border:1px dashed #3a2a34;box-shadow:none;opacity:.7}
.c.on{box-shadow:0 0 20px -2px var(--ac);outline:2px solid var(--ac);outline-offset:1px}
.c.on::after{content:"Equipped";position:absolute;right:6px;top:8px;font-size:10px;font-weight:700;color:var(--ac)}
.adm{border:1px dashed var(--ac);background:repeating-linear-gradient(135deg,#17101a 0 10px,#1a1220 10px 20px)}
input,select{background:#0f0a13;border:1px solid #4a3040;color:var(--fg)}
input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.modal .box{border-color:var(--ac);box-shadow:0 0 44px -10px var(--ac)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tabs button{flex:1}.tabs button.on{border-color:var(--ac);color:#ffd48a;box-shadow:0 0 14px -3px var(--ac)}
#shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:10px;background:linear-gradient(180deg,#1c1421,#120d17);border:1px solid var(--line)}
.item .em{font-size:28px;line-height:1.1}.item small{color:var(--mut)}.item.worn{border-color:var(--ac);box-shadow:0 0 16px -4px var(--ac)}
</style></head><body><main>

</main>

$('auto').textContent=S.autoOn?(S.auto?'Auto-roll: on':'Auto-roll: off'):'Unlock auto-roll (150)';$('bspd').textContent=`Roll speed ${S.spd}/12 (${S.spd<12?cost.spd():'max'})`;$('bluck').textContent=`Luck +10% ${S.luck}/20 (${S.luck<20?cost.luck():'max'})`;$('bpot').textContent='Luck potion x5, 25 rolls (120)';$('bcut').textContent='Cutscenes: '+(S.cut===false?'off':'on');
$('cur').innerHTML=`Equipped: <b style="color:${TC[ti]}">${e[0]}</b> · ${TN[ti]} · ${odds(e[1])} · owned ${S.inv[S.eq]||0}`;
shop();$('grid').innerHTML=A.map((a,i)=>{const c=S.inv[i],t=tier(i);return c?`<button class="c${i==S.eq?' on':''}" data-i="${i}" style="--r:${TC[t]}"><b>${a[0]}</b><small>${TN[t]} · x${c}</small></button>`:`<div class="c lock"><b>???</b><small>${odds(a[1])}</small></div>`}).join('')}
$('roll').onclick=()=>roll();
$('auto').onclick=()=>{if(!S.autoOn){if(S.coins>=150){S.coins-=150;S.autoOn=true;S.auto=true}}else S.auto=!S.auto;save();ui()};
$('bspd').onclick=()=>{if(S.spd<12&&S.coins>=cost.spd()){S.coins-=cost.spd();S.spd++;save();ui()}};
$('bluck').onclick=()=>{if(S.luck<20&&S.coins>=cost.luck()){S.coins-=cost.luck();S.luck++;save();ui()}};
$('bpot').onclick=()=>{if(S.coins>=120){S.coins-=120;S.pot+=25;save();ui()}};
$('grid').onclick=e=>{const b=e.target.closest('[data-i]');if(b){S.eq=+b.dataset.i;save();ui()}};
document.addEventListener('keydown',e=>{if(e.code=='Space'&&!['BUTTON','INPUT','SELECT'].includes(e.target.tagName)){e.preventDefault();roll()}});
function loop(now){const t=(now-t0)/1000;if(S.auto)roll();
if(anim&&now-anim.start>=anim.dur){const a=anim;anim=null;a.end()}
g.save();if(anim&&anim.kind=='cut')cut(g,anim,(now-anim.start)/anim.dur,t);
else{const a=anim,p=a?cl((now-a.start)/a.dur):0;if(a){const m=p*p*9+1.5;g.translate((Math.random()-.5)*m,(Math.random()-.5)*m)}draw(g,S.eq,t);bloom(g,.22+.03*tier(S.eq));chr(g,t,A[S.eq][4]=='glitch');if(a)rollfx(g,a,p,now)}
g.restore();if(flash>0){g.fillStyle=`rgba(255,255,255,${flash*.7})`;g.fillRect(0,0,W,H);flash-=.03}requestAnimationFrame(loop)}
const ADM={on:false,luck:1,fast:false};
$('asel').innerHTML=A.map((a,i)=>`<option value="${i}">${i+1}. ${a[0]} (${odds(a[1])})</option>`).join('');
$('admbtn').onclick=()=>{if(ADM.on)$('adm').hidden=!$('adm').hidden;else{$('admlogin').hidden=!$('admlogin').hidden;$('pw').focus()}};
const unlock=()=>{if($('pw').value==='eggegg23'){ADM.on=true;$('admlogin').hidden=true;$('adm').hidden=false;$('pw').value='';$('pwmsg').textContent=''}else $('pwmsg').textContent='Wrong password.'};
$('pwgo').onclick=unlock;$('pw').onkeydown=e=>{if(e.key=='Enter')unlock()};
$('acoin').onclick=()=>{S.coins+=Math.max(0,+$('acoinv').value||0);save();ui()};
$('aluckb').onclick=()=>{ADM.luck=Math.max(1,+$('aluckv').value||1);ui()};
$('aroll').onclick=()=>roll(+$('asel').value);
$('aeq').onclick=()=>{S.eq=+$('asel').value;save();ui()};
$('agive').onclick=()=>{const i=+$('asel').value;S.inv[i]=(S.inv[i]||0)+1;save();ui()};
$('aall').onclick=()=>{A.forEach((a,i)=>S.inv[i]=S.inv[i]||1);save();ui()};
$('afast').onclick=()=>{ADM.fast=!ADM.fast;$('afast').textContent='Instant rolls: '+(ADM.fast?'on':'off')};
$('aclr').onclick=()=>{S.inv={};S.eq=0;save();ui()};
$('alock').onclick=()=>{ADM.on=false;ADM.luck=1;ADM.fast=false;$('afast').textContent='Instant rolls: off';$('adm').hidden=true;ui()};
let tab='head';
function shop(){$('tabs').innerHTML=SLOTS.map(k=>`<button data-tab="${k}" class="${k==tab?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('');$('shop').innerHTML=ACC.filter(a=>a.slot==tab).map(a=>{const own=S.owned[a.id],on=S.wear[a.slot]==a.id;return`<div class="item${on?' worn':''}"><span class="em">${a.e}</span><b>${a.name}</b><small>${own?'Owned':a.p+' coins'}</small><button data-acc="${a.id}" ${!own&&S.coins<a.p?'disabled':''}>${own?(on?'Unequip':'Equip'):'Buy'}</button></div>`}).join('')}
$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;shop()}};
$('shop').onclick=e=>{const b=e.target.closest('[data-acc]');if(!b)return;const a=ACC.find(x=>x.id==b.dataset.acc);if(!S.owned[a.id]){if(S.coins<a.p)return;S.coins-=a.p;S.owned[a.id]=1;S.wear[a.slot]=a.id}else S.wear[a.slot]=S.wear[a.slot]==a.id?null:a.id;save();ui()};
$('bcut').onclick=()=>{S.cut=S.cut===false;save();ui()};
cv.onclick=()=>{if(anim)anim.start=-1e9};
$('aacc').onclick=()=>{ACC.forEach(a=>S.owned[a.id]=1);save();ui()};
$('rstbtn').onclick=()=>{$('rmodal').hidden=false;$('rno').focus()};
$('rno').onclick=()=>{$('rmodal').hidden=true};
$('rgo').onclick=()=>{S={coins:0,rolls:0,inv:{},eq:0,spd:0,luck:0,auto:false,autoOn:false,pot:0,owned:{},wear:{}};save();$('ban').style.opacity=0;anim=null;$('roll').textContent='Roll';$('rmodal').hidden=true;ui()};
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('rmodal').hidden=true});
ui();requestAnimationFrame(loop);
</script></body></html>
